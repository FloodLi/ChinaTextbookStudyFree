name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      assets_tag:
        description: "Release tag for assets (e.g. v1.2.0-assets)"
        required: false
        default: "v1.2.0-assets"

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (source code)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply personal customizations
        run: |
          git fetch origin ${{ github.ref_name }}
          git checkout FETCH_HEAD -- wrangler.toml
          # git checkout FETCH_HEAD -- scripts/quiz/subjects.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install release assets
        run: python3 scripts/install-release.py --tag ${{ inputs.assets_tag || 'v1.2.0-assets' }}

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Update browserslist database
        run: npx update-browserslist-db@latest

      - name: Build static site
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # - name: Prune unused audio (keep only referenced)
