      #             t = open(os.path.join(root, f), encoding="utf-8", errors="ignore").read()
      #             for a, b in audio_re.findall(t):
      #                 refs.add(a + "/" + b)
      #     print("referenced audio files:", len(refs))
      #     audio_root = os.path.join(out, "audio")
      #     removed = kept = 0
      #     for b in os.listdir(audio_root):
      #         bd = os.path.join(audio_root, b)
      #         if not os.path.isdir(bd):
      #             continue
      #         for fn in os.listdir(bd):
      #             if (b + "/" + fn) in refs:
      #                 kept += 1
      #             else:
      #                 os.remove(os.path.join(bd, fn))
      #                 removed += 1
      #     print(f"kept: {kept}, removed: {removed}")
      #     PY

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: apps/web/out
          retention-days: 3

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --branch=main
